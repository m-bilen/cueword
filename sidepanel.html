<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="theme.css">
  <style>
   body { margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
.sidebar { width: 168px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.new-thread-btn { margin: 14px 12px 18px; padding: 11px 12px; background: var(--accent); color: var(--on-accent); border: none; border-radius: var(--radius); font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; }
.new-thread-btn:hover { filter: brightness(1.08); }
.sidebar h3 { margin: 0; padding: 0 16px 8px; font-size: 12px; font-weight: 400; color: var(--text-muted); }
.history-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex-grow: 1; }
.history-item { position: relative; display: flex; align-items: center; gap: 6px; padding: 9px 12px 9px 31px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
.history-item span { flex: 1; overflow: hidden; mask-image: linear-gradient(to right, #000 80%, transparent); white-space: nowrap; }
.history-item:hover { background: var(--bg-raised); color: var(--text); }
.history-item.active { background: var(--bg-raised); color: #F4F2EE; font-weight: 500; }
.history-item.active::before { content: ''; position: absolute; left: 16px; top: 50%; width: 6px; height: 6px; margin-top: -3px; background: var(--accent); }
.rename-btn, .delete-btn { background: none; border: none; padding: 0 2px; color: var(--text-muted); font-size: 15px; line-height: 1; cursor: pointer; }
.history-item .rename-btn, .history-item .delete-btn { display: none;}
.history-item:hover .rename-btn, .history-item:hover .delete-btn { display: inline-block;}
.chat-bubble:hover .delete-btn { visibility: visible;}
.rename-btn:hover { color: var(--text); }
.delete-btn:hover { color: #F28B82; }
.main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-container { flex: 1; overflow-y: auto; padding: 4px 18px 24px; }
.chat-bubble { position: relative; padding: 18px 28px 20px 0; animation: fadeIn 0.25s ease; }
.chat-bubble .delete-btn { position: absolute; top: 20px; right: 0; font-size: 18px; visibility: hidden; }
.chat-word { margin-bottom: 8px; font-size: 21px; font-weight: 600; color: var(--accent); text-shadow: 0 1px 2px #000; overflow-wrap: break-word; }
.chat-analysis { font-family: var(--font-book); font-size: 14px; line-height: 1.55; color: var(--text-meaning); white-space: pre-line; }
.placeholder { margin-top: 40px; text-align: center; font-size: 14px; color: var(--text-muted); }
.chat-word.is-line {font-size: 16px; line-height: 1.4; }
.chat-word.is-line::before {content: '"';}
.chat-word.is-line::after {content: '"';}
.chat-word.is-line::before,
.chat-word.is-line::after {font-family: var(--font-book); font-weight: 400; color: #6E6B65; } 

@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.loading-bar { position: relative; height: 2px; margin-top: 12px; background: var(--line); overflow: hidden;}
.loading-bar::after { content: ''; position: absolute; top:0; left: -30%; width: 30%; height: 100%; background: var(--accent); animation: loading 1.2s ease-in-out infinite; }
@keyframes loading { from { left: -30%; } to {left: 100%;}}
.sr-only {position:absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;}
.analysis-arrow { color: var(--text-muted); }
.analysis-usage { color: var(--text-secondary); }
.usage-term { font-family: var(--font-ui); font-weight: 500; }
.topbar { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);}
.topbar-title { min-width: 0; font-size: 14px; font-weight: 600; color: #F4F2EE; overflow: hidden; mask-image: linear-gradient(to right, #000 80%, transparent); white-space: nowrap;}
.topbar-count { font-size: 12px; color: var(--text-muted); white-space: nowrap;}
.icon-btn { flex-shrink: 0; width: 32px; height: 32px; display: flex; align-items:center; justify-content: center; padding: 0; background: none; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text-muted); cursor: pointer; }
.icon-btn:hover { color: var(--text); border-color: var(--text-muted); }
.layout { flex: 1; min-height: 0; display: flex; }
.threads-collapsed .sidebar { width: 48px; }
.threads-collapsed .sidebar h3,
.threads-collapsed .history-list { display: none;}
.threads-collapsed .new-thread-btn { width: 32px; height: 32px; margin: 14px 8px; padding: 0; font-size: 0; text-align: center;}
.threads-collapsed .new-thread-btn::before { content: '+'; font-size: 18px;}
.threads-collapsed .chevron { transform: rotate(180deg); transform-origin: 14.75px 12px;}
.review-btn { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; margin-left: auto; background: none; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text);  font-size: 13px; font-weight: 600; cursor: pointer;}
.review-btn:hover { border-color: var(--text-muted);}
.review-count { background: var(--accent); color: var(--on-accent); font-size: 11px; padding: 1px 6px; border-radius: var(--radius);}
.review-count:empty { display: none;}

.review-view { display: none; flex: 1; min-height: 0; flex-direction: column;}
.reviewing .layout { display: none; }
.reviewing .review-view { display: flex; }
.review-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line);}
.review-progress { font-size: 12px; color: var(--text-muted); }
.review-top .icon-btn { margin-left: auto; }
.review-stage { flex: 1; overflow-y: auto; padding: 24px 22px; }
.review-scope { display: flex; gap: 4px;}
.review-scope button { background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 4px 10px; color: var(--text-muted); font-size: 12px; cursor: pointer;}
.review-scope button.active { border-color: var(--line); color: var(--text); }
.review-context { margin: 0 0 8px; font-family: var(--font-book); font-size: 17px; line-height: 1.5; color: var(--text-meaning);}
.review-context mark { background: none; color: var(--accent); font-family: var(--font-ui); font-weight: 600;}
.review-word { margin: 0 0 8px; font-size: 28px; font-weight: 600; color: var(--accent);}
.review-prompt { margin: 0 0 20px; font-size: 13px; color: var(--text-muted);}
.review-options { display: flex; flex-direction: column; gap: 8px;}
.review-option { padding: 12px 14px; text-align: left; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); font-family: var(--font-book); font-size: 14px; cursor: pointer;}
.review-option:not(:disabled):hover { border-color: var(--text-muted); }
.review-empty { margin-top: 40px; text-align: center; font-size: 14px; color: var(--text-muted); }
.review-option:disabled { cursor: default;}
.review-option.is-correct { border-color: var(--accent); color: var(--accent); }
.review-option.is-wrong { border-color: #F28B82; color: #F28B82;}
.review-option:disabled:not(.is-correct):not(.is-wrong) { opacity: 0.4;}
.review-reveal { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.review-meaning { margin: 0 0 8px; }
.review-source { margin: 12px 0 0; font-size: 0.8em; opacity: 0.5; }
.review-continue { display: block; width: 100%; margin-top: 16px; padding: 10px; background: none; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); cursor: pointer; }
.review-continue:hover, .review-continue:focus-visible { border-color: var(--text-muted); }
.review-continue { display: block; width: 100%; margin-top: 16px; padding: 10px; background: none; border: 1px solid rgba(255,255,255,0.15); color: inherit; font: inherit; cursor: pointer;}
.review-continue:hover, .review-continue:focus-visible { border-color: rgba(255,255,255,0.35);}

  </style>
  
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="toggleThreadsBtn" data-i18n-title="toggleThreads">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15"></rect><line x1="9.5" y1="4.5" x2="9.5" y2="19.5"></line><polyline class="chevron" points="16 9.5 13.5 12 16 14.5"></polyline></svg>
    </button>
    <div class="topbar-title" id="currentThreadTitle"></div>
    <div class="topbar-count" id="currentThreadCount"></div>
    <button id="reviewBtn" class ="review-btn" type="button">
    <span data-i18n="review"></span>
    <span id="reviewCount" class="review-count"></span>
    </button>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="settingsTitle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="17" x2="20" y2="17"></line><circle cx="9" cy="7" r="2.2" fill="#0E0E0D"></circle><circle cx="15" cy="17" r="2.2" fill="#0E0E0D"></circle></svg>
    </button>
  </header>

  <div class="layout">
    <div class="sidebar">
      <button class="new-thread-btn" id="newThreadBtn" data-i18n="newThread"></button>
      <h3 data-i18n="threadsHeader"></h3>
      <ul class="history-list" id="threadList"></ul>
    </div>
    <div class="main-content">
      <div class="chat-container" id="chatContainer">
        <p class="placeholder" data-i18n="emptyPanel"></p>
      </div>
    </div>
  </div>
      <section id="reviewView" class="review-view">
      <div class="review-top">
        <div class="review-scope">
          <button type="button" data-scope="thread" data-i18n="scopeThread"></button>
          <button type="button" data-scope="all" data-i18n="scopeAll"></button>
        </div>
        <span id="reviewProgress" class="review-progress"></span>
        <button id="reviewClose" class="icon-btn" type="button" data-i18n-title="close">×</button>
      </div>
      <div id="reviewStage" class="review-stage"></div>
    </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
