<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sub Context Analyzer</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background-color: #131314; color: #e3e3e3; }
    .sidebar { width: 210px; background-color: #1e1f20; border-right: 1px solid #444746; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; }
    .new-thread-btn { background-color: #0078d4; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; font-size: 13px; transition: 0.2s; }
    .new-thread-btn:hover { background-color: #005a9e; }
    .sidebar h3 { font-size: 11px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .history-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
    .history-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 5px; color: #c4c7c5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item:hover, .history-item.active { background-color: #333537; color: #fff; }
    .history-item.active { border-left: 3px solid #0078d4; font-weight: bold; }
    .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; background-color: #131314; }
    .chat-container { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .chat-bubble { background-color: #1e1f20; border: 1px solid #444746; padding: 12px 15px; border-radius: 12px; max-width: 95%; animation: fadeIn 0.3s ease; }
    .chat-word { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .chat-analysis { font-size: 14px; line-height: 1.5; color: #e3e3e3; white-space: pre-line; }
    .placeholder { color: #80868b; text-align: center; margin-top: 40px; font-style: italic; font-size: 14px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="sidebar">
    <button class="new-thread-btn" id="newThreadBtn">+ Yeni Başlık Aç</button>
    <h3>Dizi / Film Başlıkları</h3>
    <ul class="history-list" id="threadList"></ul>
  </div>
  <div class="main-content">
    <div class="chat-container" id="chatContainer">
      <p class="placeholder">Soldan bir başlık seç veya yeni bir başlık açıp dizini izlemeye başla...</p>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
