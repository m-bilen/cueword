<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <title data-i18n="settingsTitle"></title>
   <link rel="stylesheet" href="theme.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
  }
  .settings {
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 24px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  h1 {
    margin: 0;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    font-size: 28px;
    font-weight: 600;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  label {
    font-size: 13px;
    color: var(--text-muted);
  }
  input, select {
    padding: 12px 14px;
    background: var(--bg-raised);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 14px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  select {
    appearance: none;
    padding-right: 40px;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23A3A098' stroke-width='2' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }
  .help {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .help a { color: var(--text); }
  .help a:hover { color: #fff; }
  .actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 6px;
  }
  button {
    padding: 12px 26px;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #status {
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>

</head>
<body>
    <main class="settings">
  <h1 data-i18n="settingsTitle"></h1>

  <section class="field">
    <label for="apiKeyInput" data-i18n="apiKeyLabel"></label>
    <input type="password" id="apiKeyInput" data-i18n-placeholder="apiKeyPlaceholder">
    <p class="help">
      <span data-i18n="apiKeyHelp"></span>
      <a href="https://aistudio.google.com/apikey" target="_blank" data-i18n="apiKeyHelpLink"></a>
    </p>
  </section>

  <section class="field">
    <label for="languageSelect" data-i18n="languageLabel"></label>
    <select id="languageSelect">
       <option value="Turkish">Türkçe</option>
        <option value="English">English</option>
        <option value="Spanish">Español</option>
        <option value="German">Deutsch</option>
        <option value="French">Français</option>
        <option value="Polish">Polski</option>
        <option value="Italian">Italiano</option>
        <option value="Portuguese">Português</option>
        <option value="Russian">Русский</option>
        <option value="Arabic">العربية</option>
    </select>
  </section>

  <div class="actions">
    <button id="saveBtn" data-i18n="save"></button>
    <p id="status"></p>
  </div>
</main>

<script type="module" src="options.js"></script>
</body>
</html>
